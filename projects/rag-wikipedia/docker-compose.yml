services:
  qdrant:
    # v1.18.x provides the Query API (/points/query, added in server 1.10) that
    # retrieval's query_points() call requires. Client floor is set in
    # backend/pyproject.toml (query_points exists from client 1.10).
    #
    # UPGRADING OVER AN EXISTING VOLUME: Qdrant does not support skipping minor
    # versions on a single node. Starting v1.18.3 on storage written by v1.9.2
    # panics at boot and the container exits 101:
    #   "Failed to deserialize .../segment.json: unknown variant `on_disk`"
    # There is no in-place fix — use a FRESH volume and re-ingest:
    #   docker compose down
    #   docker volume rm rag-wikipedia_qdrant_data
    #   docker compose up -d qdrant && make ingest
    # (The supported alternative is a staged upgrade through every intermediate
    # minor with snapshots at each step; overkill for this demo corpus.)
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # image has no wget/curl; bash TCP probe instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # image has no wget/curl; the CLI probes the server
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - PROFILE=${PROFILE:-tiny}
      # Users live in SQLite by default; point this at postgresql+asyncpg://…
      # to move them to a real database server.
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/app.db}
      - JWT_SECRET=${JWT_SECRET:-}
      # Protects each tenant's IdP client secret at rest. Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-}
      # First account to receive the admin role, so somebody can register the
      # first organization.
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - SESSION_IDLE_TIMEOUT_MINUTES=${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      - SESSION_ABSOLUTE_LIFETIME_HOURS=${SESSION_ABSOLUTE_LIFETIME_HOURS:-8}
      # The demo is served over plain http, so the session cookie cannot be
      # marked Secure or the browser would drop it. Set this to true (and serve
      # over https) anywhere else.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Both point at the frontend, which reverse-proxies /auth to this service.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - OAUTH_REDIRECT_BASE_URL=${OAUTH_REDIRECT_BASE_URL:-http://localhost:5173}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
      # keeps registered accounts across container rebuilds
      - api_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      # python:slim has no wget/curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant_data:
  ollama_data:
  hf_cache:
  api_data:
