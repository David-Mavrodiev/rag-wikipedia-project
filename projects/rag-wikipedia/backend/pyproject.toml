[project]
name = "rag-wikipedia-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    # Must provide the Query API (query_points), which vectorstore.py calls and
    # the pinned Qdrant server (v1.18.3 in docker-compose) exposes.
    # Verified against the client source: query_points is present from 1.10
    # (absent in 1.9.x), and the legacy search() was removed in 1.16. So 1.10
    # is the true floor; >=1.12 is a deliberately conservative pin — it is the
    # range this project has actually been run and tested against.
    "qdrant-client>=1.12,<2",
    # BGEEmbedder.dim reads get_embedding_dimension, which exists on
    # SentenceTransformer from 5.4.0. Verified against the released wheels, not
    # the changelog: 3.0 through 5.3 have only get_sentence_embedding_dimension,
    # and 5.4 renamed it and left the old name as a FutureWarning alias. So the
    # previous >=3.0 floor admitted versions the code can no longer run on.
    # <6 because 5.x is the range this project has actually been run and tested
    # against. 6.0 already exists, and a major bump deserves a deliberate diff
    # rather than arriving silently the next time someone re-locks.
    "sentence-transformers>=5.4,<6",
    "prefect>=3,<4",
    "datasets>=2.19",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "ollama>=0.2",
    "redis>=5.0",
]

# Extras policy.
#
# An extra is added in the SAME commit as the first code that imports it, never
# in advance. A speculative extra locks a dependency graph nobody uses, and
# `uv sync --locked` then makes every CI job pay to install it.
#
# Who installs what, and why (the workflows carry the same note):
#   dev    - pytest, pytest-cov, ruff. backend-ci only, via `--extra dev`.
#   agent  - the graph runtime for the langgraph engine. To be added alongside
#            backend/engines/; backend-ci gains `--extra agent` at that point,
#            because an agent whose tests do not run is worse than a slow job.
#   gcp    - Vertex / BigQuery SDKs. NOT installed in CI: adapters import their
#            SDK lazily inside __init__, so their tests patch sys.modules the
#            way tests/test_llm.py already does for ollama.
#
# eval-quality installs NO extras: it measures retrieval and runs neither
# pytest nor ruff.
[project.optional-dependencies]
# The graph runtime for the `langgraph` engine. Kept out of the base
# dependencies: the serving path defaults to `direct`, which needs none of this,
# so a deployment that does not run the agent does not install it.
agent = [
    # Pinned to the majors this was built and measured against. langgraph
    # reached 1.x, so a major bump is a breaking-change signal worth catching
    # in a diff rather than in a silently different graph.
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
]

# Vertex AI adapters for the LLM and Embedder interfaces (backend/providers/).
# Kept out of the base dependencies for the same reason as `agent`: the served
# path defaults to the local models, which need none of this.
#
# NOT INSTALLED IN CI, on purpose. providers/vertex.py imports the SDK inside
# __init__, so tests/test_vertex.py patches sys.modules with a fake the way
# tests/test_llm.py does for ollama. The contracts are therefore enforced on
# every run on a machine that has never authenticated to Google, and
# tests/test_layering.py asserts the laziness that makes that possible.
#
# `vertexai` is a namespace shipped INSIDE google-cloud-aiplatform, which is
# why the import name and the distribution name differ. Pinned to the 1.x line:
# unlike the pins above, this range has NOT been exercised against a live
# billed endpoint, so a major bump deserves a deliberate diff rather than
# arriving silently the next time someone re-locks.
gcp = [
    "google-cloud-aiplatform>=1.71,<2",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Coverage measurement. >=5 is the first line that reads its settings from
    # pyproject.toml's [tool.coverage.*] rather than needing a .coveragerc, so
    # the gate below travels with the project instead of a second config file.
    "pytest-cov>=5",
    "ruff>=0.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline", "eval", "engines"]

[tool.hatch.build.targets.sdist]
include = ["app", "pipeline", "eval", "engines", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# --- coverage ---------------------------------------------------------------
# Config lives here rather than in a .coveragerc so `pytest --cov`, `make
# coverage` and the CI gate all read the same numbers from one file.
[tool.coverage.run]
# Every package this project ships, named explicitly. Naming them (rather than
# letting --cov default to "whatever got imported") is what makes an untouched
# module count as 0% instead of vanishing from the report: a file nobody
# imports is exactly the gap a coverage number exists to expose.
#
# `tests` is deliberately absent - measuring the suite against itself reports
# the test files' own execution, which is always ~100% and says nothing about
# the code under test.
source = ["app", "pipeline", "eval", "engines", "providers"]

# Branch coverage, not just statement coverage. The refusal and retrieval paths
# are dense with conditionals whose false side is the interesting one; a
# statement-only number calls an `if` covered when only one side ever ran.
branch = true

omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

# The floor, enforced locally by `make coverage` and in CI by the same command.
# Set to the measured number rounded down, and RATCHETED UP as coverage
# improves - never down to make a red build green. Lowering it is the same move
# as relaxing an eval gate: the number keeps being reported while quietly
# meaning less.
#
# Measured 84.41% over 362 tests when this gate was introduced, so 84 is the
# baseline held, not an aspiration. The gap is concentrated and known:
# eval/bench_ingest.py (30%) and eval/audit.py (49%) are long report-writing
# scripts, and pipeline/sources.py (60%) is the Hugging Face download path that
# the fixture profile deliberately never takes.
fail_under = 84

exclude_also = [
    # Type-checking-only imports never execute at runtime.
    "if TYPE_CHECKING:",
    # Script entry points: these run under `make ingest` / `make eval`, not
    # under pytest, so counting them would measure the Makefile, not the code.
    "if __name__ == .__main__.:",
    # Interface declarations. A Protocol/ABC body that raises is a contract,
    # not behaviour - the implementations are what the tests must cover.
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
