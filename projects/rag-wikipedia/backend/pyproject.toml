[project]
name = "rag-wikipedia-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    # Must provide the Query API (query_points), which vectorstore.py calls and
    # the pinned Qdrant server (v1.18.3 in docker-compose) exposes.
    # Verified against the client source: query_points is present from 1.10
    # (absent in 1.9.x), and the legacy search() was removed in 1.16. So 1.10
    # is the true floor; >=1.12 is a deliberately conservative pin — it is the
    # range this project has actually been run and tested against.
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3.0",
    "prefect>=3,<4",
    "datasets>=2.19",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "ollama>=0.2",
    "redis>=5.0",
    # Tracing. The api package is the only hard requirement of app/core - it is
    # a no-op without an SDK, which is what lets the instrumentation ship
    # independently of the decision about where traces go. The rest are imported
    # lazily by configure_tracing().
    #
    # The instrumentation packages are versioned on a SEPARATE, still-pre-1.0
    # series (0.48b0 pairs with SDK 1.27) and are released in lockstep with it,
    # so the two floors have to move together.
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline", "eval"]

[tool.hatch.build.targets.sdist]
include = ["app", "pipeline", "eval", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# Measure the three shipped packages only; the test suite itself is excluded so
# the percentage reflects production code, not test-file execution.
source = ["app", "pipeline", "eval"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    # Type-checking-only imports never execute at runtime.
    "if TYPE_CHECKING:",
    # Script entry points are exercised via the Makefile / Prefect, not pytest.
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
